<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>นำเข้าข้อมูล</title>
<style>body{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px}button{padding:10px 16px;font:inherit}pre{background:#f3f4f6;padding:10px;white-space:pre-wrap}</style></head><body>
<h1>นำเข้าข้อมูลจากไฟล์สำรอง (JSON)</h1>
<p>เลือกไฟล์ <b>key-account-backup-….json</b> ที่ได้จากปุ่ม “สำรองข้อมูลทั้งหมด” ในหน้าเดิม ข้อมูลที่มี id เดียวกันจะถูกเขียนทับ ไม่สร้างซ้ำ</p>
<input type="file" id="f" accept=".json,application/json"> <button id="go" disabled>นำเข้า</button><pre id="log"></pre>
<script src="config.js"></script><script>/* Replaces the Claude Artifact runtime (window.claude) with Supabase: login + shared "docs" table. */
(function(){
  var cfg=window.APP_CONFIG||{};
  var SKEY='kah_session', session=null, ready=null, listeners=[];
  function store(v){try{if(v)localStorage.setItem(SKEY,JSON.stringify(v));else localStorage.removeItem(SKEY)}catch(e){}}
  function load(){try{return JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){return null}}
  function hdr(tok){return {'apikey':cfg.SUPABASE_ANON_KEY,'Authorization':'Bearer '+(tok||cfg.SUPABASE_ANON_KEY),'Content-Type':'application/json'}}
  function toSession(j){return {access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||''}}

  function signIn(email,password){
    return fetch(cfg.SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:hdr(),body:JSON.stringify({email:email,password:password})}).then(function(r){
      return r.json().then(function(j){if(!r.ok||!j.access_token){var e=new Error('bad');e.bad=true;throw e}return toSession(j)})});
  }
  function refresh(){
    if(!session||!session.refresh_token)return Promise.reject(new Error('nosession'));
    return fetch(cfg.SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:hdr(),body:JSON.stringify({refresh_token:session.refresh_token})}).then(function(r){
      return r.json().then(function(j){if(!r.ok||!j.access_token){session=null;store(null);throw new Error('expired')}session=toSession(j);if(!session.email)session.email=load()&&load().email||'';store(session);return session})});
  }
  function token(){
    if(session&&session.expires_at-60>Date.now()/1000)return Promise.resolve(session.access_token);
    return refresh().then(function(s){return s.access_token});
  }
  function api(path,opt,retried){
    opt=opt||{};
    return token().then(function(t){
      var h=Object.assign(hdr(t),opt.headers||{});
      return fetch(cfg.SUPABASE_URL+path,{method:opt.method||'GET',headers:h,body:opt.body})
    }).then(function(r){
      if(r.status===401&&!retried){session&&(session.expires_at=0);return api(path,opt,true)}
      if(!r.ok)return r.text().then(function(t){var j={};try{j=JSON.parse(t)}catch(e){}var e=new Error(j.message||t||('HTTP '+r.status));e.code=j.code||String(r.status);throw e});
      return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null});
    });
  }

  function loginUI(msg0){
    return new Promise(function(resolve){
      var o=document.createElement('div');
      o.style.cssText='position:fixed;inset:0;z-index:99999;background:#f3f4f6;display:flex;align-items:center;justify-content:center;padding:16px;font-family:"IBM Plex Sans Thai",system-ui,sans-serif';
      o.innerHTML='<form style="background:#fff;border:1px solid #dcdfe4;border-radius:12px;padding:28px;width:min(360px,100%);box-shadow:0 8px 30px rgba(0,0,0,.08)">'
        +'<h1 style="margin:0 0 4px;font-size:20px">Key Account Hub</h1><p style="margin:0 0 18px;color:#667;font-size:13px">เข้าสู่ระบบเพื่อใช้งาน</p>'
        +'<label style="font-size:13px">อีเมล<input id="lgE" type="email" required autocomplete="username" style="display:block;width:100%;box-sizing:border-box;margin:4px 0 12px;padding:10px;border:1px solid #cfd3d9;border-radius:6px;font:inherit"></label>'
        +'<label style="font-size:13px">รหัสผ่าน<input id="lgP" type="password" required autocomplete="current-password" style="display:block;width:100%;box-sizing:border-box;margin:4px 0 12px;padding:10px;border:1px solid #cfd3d9;border-radius:6px;font:inherit"></label>'
        +'<div id="lgM" style="color:#c0392b;font-size:13px;min-height:18px;margin-bottom:8px">'+(msg0||'')+'</div>'
        +'<button style="width:100%;padding:10px;border:0;border-radius:6px;background:#0f6f7c;color:#fff;font:inherit;font-weight:500;cursor:pointer">เข้าสู่ระบบ</button></form>';
      document.body.appendChild(o);
      o.querySelector('form').onsubmit=function(e){
        e.preventDefault();var m=o.querySelector('#lgM');m.textContent='';
        signIn(o.querySelector('#lgE').value.trim(),o.querySelector('#lgP').value).then(function(s){o.remove();resolve(s)},function(err){
          m.textContent=err&&err.bad?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':'เชื่อมต่อ Supabase ไม่ได้ (อาจถูกบล็อกโดยเครือข่าย หรือใส่ URL ผิด)';
        });
      };
    });
  }
  function logoutBtn(email){
    var b=document.createElement('button');
    b.textContent='ออกจากระบบ'+(email?' ('+email+')':'');
    b.style.cssText='position:fixed;right:10px;bottom:8px;z-index:50;font:12px "IBM Plex Sans Thai",system-ui;padding:4px 10px;border:1px solid #cfd3d9;border-radius:6px;background:#fff;cursor:pointer;opacity:.85';
    b.onclick=function(){store(null);location.reload()};
    document.body.appendChild(b);
  }

  function init(){
    if(ready)return ready;
    ready=new Promise(function(resolve){
      if(!cfg.SUPABASE_URL||/YOUR_/.test(cfg.SUPABASE_URL)||!cfg.SUPABASE_ANON_KEY||/YOUR_/.test(cfg.SUPABASE_ANON_KEY)){
        window.__dbWhy='config';resolve(null);return}
      session=load();
      var p=session&&session.expires_at-60>Date.now()/1000?Promise.resolve(session):session?refresh().catch(function(e){return e&&e.message==='expired'?null:(session&&session.access_token?session:null)}):Promise.resolve(null);
      p.then(function(s){return s||loginUI()}).then(function(s){session=s;store(s);logoutBtn(s.email);resolve(true)});
    });
    return ready;
  }

  function fetchAll(name){
    var out=[],step=1000;
    function page(from){
      return api('/rest/v1/docs?select=id,data&collection=eq.'+encodeURIComponent(name)+'&order=id',{headers:{'Range-Unit':'items','Range':from+'-'+(from+step-1)}}).then(function(rows){
        rows=rows||[];out=out.concat(rows);
        return rows.length===step?page(from+step):out;
      });
    }
    return page(0);
  }
  function snapOf(rows){return {docs:rows.map(function(r){return {id:r.id,data:function(){return Object.freeze(Object.assign({},r.data||{}))}}})}}
  function bump(){setTimeout(function(){listeners.forEach(function(f){f()})},400)}

  function collection(name){
    return {
      get:function(){return fetchAll(name).then(snapOf)},
      onSnapshot:function(cb,errCb){
        var dead=false,last=null;
        function run(){fetchAll(name).then(function(rows){if(dead)return;var sg=JSON.stringify(rows);if(sg===last)return;last=sg;cb(snapOf(rows))},function(e){if(!dead&&errCb&&last===null)errCb(e)})}
        run();listeners.push(run);
        var iv=setInterval(function(){if(!document.hidden)run()},8000);
        return function(){dead=true;clearInterval(iv);listeners=listeners.filter(function(f){return f!==run})};
      },
      doc:function(id){
        id=id||(window.crypto&&crypto.randomUUID?crypto.randomUUID():('d'+Date.now()+Math.random().toString(36).slice(2)));
        return {id:id,
          set:function(d){return api('/rest/v1/docs',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({collection:name,id:id,data:d})}).then(function(){bump()})},
          update:function(d){return api('/rest/v1/rpc/docs_merge',{method:'POST',body:JSON.stringify({c:name,i:id,d:d})}).then(function(){bump()})},
          delete:function(){return api('/rest/v1/docs?collection=eq.'+encodeURIComponent(name)+'&id=eq.'+encodeURIComponent(id),{method:'DELETE'}).then(function(){bump()})}};
      }
    };
  }

  var downloads={save:function(o){
    var blob=new Blob([o.data],{type:/\.json$/.test(o.filename)?'application/json':'text/csv;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.filename;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);return Promise.resolve();
  }};

  window.claude={use:function(x){
    if(x==='downloads')return Promise.resolve(downloads);
    if(x==='user')return Promise.resolve({can:function(){return true}});
    if(x==='db')return init().then(function(c){return c?{collection:collection}:null});
    return Promise.resolve(null);
  }};
  })();
</script>
<script>
var data=null,log=function(t){document.getElementById('log').textContent+=t+'\n'};
document.getElementById('f').onchange=function(){var r=new FileReader();r.onload=function(){try{data=JSON.parse(r.result);document.getElementById('go').disabled=false;log('อ่านไฟล์แล้ว')}catch(e){log('ไฟล์ไม่ถูกต้อง')}};r.readAsText(this.files[0])};
document.getElementById('go').onclick=function(){
  this.disabled=true;
  claude.use('db').then(function(db){
    if(!db){log('ยังไม่ได้ตั้งค่า Supabase');return}
    var names=['key_accounts','crm_deals','quote_forms','group_logos','dash_todos'],p=Promise.resolve();
    names.forEach(function(n){(data[n]||[]).forEach(function(d){p=p.then(function(){return db.collection(n).doc(d.id).set(d.data)})});p=p.then(function(){log(n+': '+(data[n]||[]).length+' รายการ')})});
    return p.then(function(){log('เสร็จแล้ว')},function(e){log('ผิดพลาด: '+(e&&e.message||e))});
  });
};
</script></body></html>
